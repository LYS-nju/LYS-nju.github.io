<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yusong Liu · 刘雨松</title>
  <meta name="description" content="Yusong Liu (刘雨松), undergraduate student in the School of Computer Science at Nanjing University. Contact: 241275013@smail.nju.edu.cn.">
  <meta name="color-scheme" content="light">
  <style>
    :root { --paper: #faf9f6; --ink: #25252a; --muted: #676570; --accent: #625080; --line: #e3e0e6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Microsoft YaHei", sans-serif; line-height: 1.7; }
    .page { width: min(100% - 48px, 860px); margin: 0 auto; padding: 48px 0 32px; }
    header { display: flex; align-items: center; gap: 12px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .mark { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    .label { color: var(--muted); font-size: 12px; letter-spacing: .13em; text-transform: uppercase; }
    .intro { padding: 78px 0 58px; }
    h1 { margin: 0; font-size: clamp(40px, 7vw, 62px); line-height: 1.2; font-weight: 600; letter-spacing: -.045em; }
    .chinese-name { display: block; margin-top: 15px; font-size: 23px; letter-spacing: .14em; font-weight: 400; color: var(--muted); }
    .position { margin: 28px 0 0; font-size: 18px; }
    .affiliation { margin: 3px 0 0; color: var(--muted); }
    .details { border-top: 1px solid var(--line); }
    section { display: grid; grid-template-columns: 150px 1fr; gap: 30px; padding: 30px 0; border-bottom: 1px solid var(--line); }
    h2 { margin: 3px 0 0; color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    p { margin: 0; }
    .translation { margin-top: 12px; color: var(--muted); font-size: 15px; }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 5px; overflow-wrap: anywhere; }
    a:hover { color: var(--ink); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 2px; }
    .email { font-size: clamp(16px, 2.7vw, 19px); }
    footer { padding-top: 28px; color: var(--muted); font-size: 12px; }
    @media (max-width: 560px) {
      .page { width: calc(100% - 40px); padding-top: 28px; }
      .intro { padding: 54px 0 40px; }
      section { grid-template-columns: 1fr; gap: 12px; padding: 25px 0; }
      .position { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header><span class="mark" aria-hidden="true"></span><span class="label">Personal homepage</span></header>
    <main>
      <div class="intro">
        <h1>Yusong Liu<span class="chinese-name" lang="zh-CN">刘雨松</span></h1>
        <p class="position">Undergraduate Student</p>
        <p class="affiliation">School of Computer Science · Nanjing University</p>
      </div>
      <div class="details">
        <section aria-labelledby="about-title">
          <h2 id="about-title">About</h2>
          <div>
            <p>I am an undergraduate student in the School of Computer Science at Nanjing University.</p>
            <p class="translation" lang="zh-CN">我是刘雨松，南京大学计算机学院本科生。</p>
          </div>
        </section>
        <section aria-labelledby="contact-title">
          <h2 id="contact-title">Contact</h2>
          <div><a class="email" href="mailto:241275013@smail.nju.edu.cn">241275013@smail.nju.edu.cn</a></div>
        </section>
      </div>
    </main>
    <footer>Yusong Liu · <span lang="zh-CN">刘雨松</span></footer>
  </div>
</body>
</html>
